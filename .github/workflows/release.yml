name: Release

# 发版前请同步：VERSION、DevBox.Host.csproj（Version 等）、CHANGELOG.md，再打标签 vX.Y.Z
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag（须与 VERSION 一致，如 v1.1.0）'
        required: true
        default: 'v1.1.0'

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20'
  CSPROJ: DevBox.Host/DevBox.Host.csproj
  APP_ID: DevBox
  PRODUCT_NAME: DevBox
  COMPANY_NAME: FNSoftware
  FRAMEWORK: net10-x64-desktop
  RUNTIME: win-x64
  ICON: DevBox.Host/Resources/icon.ico

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          function Fail([string]$Message) {
            Write-Error $Message
            exit 1
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.version }}'.Trim()
          } else {
            $tag = '${{ github.ref_name }}'
          }

          if ($tag -notmatch '^v') { $tag = "v$tag" }
          $semver = $tag.Substring(1)

          if ($semver -notmatch '^\d+\.\d+\.\d+([-.][\w.-]+)?$') {
            Fail "Invalid version '$semver'. Use semver: X.Y.Z or X.Y.Z-prerelease"
          }

          if (-not (Test-Path VERSION)) {
            Fail 'Missing VERSION file at repository root.'
          }
          $versionFile = (Get-Content VERSION -Raw).Trim()
          if ($versionFile -ne $semver) {
            Fail @"
          Version mismatch:
            Git tag:     $tag ($semver)
            VERSION:     $versionFile

          Before releasing, set VERSION, DevBox.Host.csproj <Version>, and CHANGELOG ## [$semver], then commit and tag again.
          "@
          }

          $csproj = Get-Content DevBox.Host/DevBox.Host.csproj -Raw
          if ($csproj -notmatch '<Version>\s*([^\s<]+)\s*</Version>') {
            Fail 'Could not parse <Version> from DevBox.Host.csproj'
          }
          $csprojVersion = $Matches[1]
          if ($csprojVersion -ne $semver) {
            Fail @"
          Version mismatch:
            Git tag:           $semver
            DevBox.Host.csproj: $csprojVersion

          Update <Version> in DevBox.Host.csproj to match the tag.
          "@
          }

          if ($semver -match '^(\d+)\.(\d+)\.(\d+)') {
            $assemblyVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            $assemblyVersion = "$semver.0"
          }

          $isPrerelease = $semver -match '[-.]'
          $prereleaseFlag = if ($isPrerelease) { 'true' } else { 'false' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$prereleaseFlag" >> $env:GITHUB_OUTPUT

          Write-Host "Release version: $tag (assembly: $assemblyVersion, prerelease: $isPrerelease)"

      - name: Verify CHANGELOG entry
        shell: pwsh
        run: |
          $semver = '${{ steps.version.outputs.semver }}'
          $changelog = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($semver)
          if ($changelog -notmatch "## \[$escaped\]") {
            Write-Error "CHANGELOG.md has no '## [$semver]' section. Add release notes before tagging."
            exit 1
          }
          Write-Host "✓ CHANGELOG contains ## [$semver]"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build React UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      # Framework-dependent single-file (Setup.exe installs missing Desktop Runtime via --framework)
      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish ${{ env.CSPROJ }} `
            -c Release `
            -r ${{ env.RUNTIME }} `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=${{ steps.version.outputs.semver }} `
            -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} `
            -p:FileVersion=${{ steps.version.outputs.assembly_version }} `
            -p:InformationalVersion=${{ steps.version.outputs.semver }} `
            -o ./artifacts/publish `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          Copy-Item -Path ui/dist -Destination artifacts/publish/wwwroot -Recurse
          if (-not (Test-Path artifacts/publish/wwwroot/index.html)) {
            throw "wwwroot/index.html missing after UI copy"
          }

      - name: Cleanup and verify built executable
        shell: pwsh
        run: |
          Get-ChildItem artifacts/publish -Filter "*.xml" -File -ErrorAction SilentlyContinue |
            Remove-Item -Force

          $expected = '${{ steps.version.outputs.semver }}'
          $exe = Join-Path $PWD 'artifacts/publish/DevBox.exe'
          if (-not (Test-Path $exe)) {
            Write-Error "DevBox.exe not found at $exe"
            exit 1
          }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $product = $info.ProductVersion
          if ($product -notlike "$expected*") {
            Write-Error "Built exe ProductVersion is '$product', expected '$expected'"
            exit 1
          }
          Write-Host "✓ DevBox.exe ProductVersion: $product"
          $mb = [math]::Round(((Get-ChildItem artifacts/publish -Recurse -File | Measure-Object Length -Sum).Sum)/1MB,2)
          Write-Host "publish 目录大小: $mb MB"

      # 发布说明：git describe 在无上一 tag / 浅克隆时退出码非 0，
      # 必须用管道捕获 stdout 而非依赖 $LASTEXITCODE，最后显式 exit 0。
      # RELEASE_NOTES.md 必须在 vpk pack 前存在（硬校验），先无条件写入。
      - name: Build release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.semver }}'
          "## ${{ env.PRODUCT_NAME }} $version" | Set-Content RELEASE_NOTES.md
          $prev = ""
          git describe --tags --abbrev=0 "${{ github.sha }}~1" 2>$null | ForEach-Object { $prev = $_ }
          if ($prev) {
            git log --oneline "$prev..${{ github.sha }}" | Add-Content RELEASE_NOTES.md
          } else {
            "" | Add-Content RELEASE_NOTES.md
          }
          exit 0

      - name: Install vpk CLI (matching Velopack NuGet version)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.0
          dotnet tool list -g | Select-String vpk

      # 下载上一版本用于生成 delta 增量包；首次发布无上一版本属正常，放行不 fail
      - name: Download previous Velopack release (for delta)
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack
          if ($LASTEXITCODE -ne 0) { Write-Host "未找到上一 Velopack 版本，跳过 delta（首次发布属正常）" }

      - name: vpk pack (Setup + full/delta nupkg + Portable.zip + RELEASES)
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          vpk pack `
            -u "${{ env.APP_ID }}" `
            -v ${{ steps.version.outputs.semver }} `
            -r ${{ env.RUNTIME }} `
            -p artifacts/publish `
            -o artifacts/velopack `
            -e ${{ env.APP_ID }}.exe `
            --packTitle "${{ env.PRODUCT_NAME }}" `
            --packAuthors "${{ env.COMPANY_NAME }}" `
            -i ${{ env.ICON }} `
            --framework ${{ env.FRAMEWORK }} `
            --releaseNotes RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw "vpk pack failed" }
          if (-not (Test-Path "artifacts/velopack/${{ env.APP_ID }}-win-Setup.exe")) { throw "Velopack 安装包未生成" }
          Get-ChildItem artifacts/velopack -File |
            Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize

      - name: Upload to GitHub Release (tag trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "${{ secrets.GITHUB_TOKEN }}" `
            --outputDir artifacts/velopack `
            --publish `
            --releaseName "${{ env.PRODUCT_NAME }} ${{ steps.version.outputs.semver }}" `
            --tag ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { throw "vpk upload failed" }

      # 装饰性步骤：设置 Release 正文。try/catch 兜底，任何失败都不影响发布成功。
      - name: Set release body from RELEASE_NOTES.md (best effort)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
            gh release edit ${{ github.ref_name }} `
              --notes-file RELEASE_NOTES.md `
              --repo ${{ github.repository }}
          } catch {
            Write-Host "release body 更新跳过: $($_.Exception.Message)"
          }

      # workflow_dispatch 手动触发时保留产物供下载
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT_NAME }}-${{ steps.version.outputs.semver }}
          path: artifacts/velopack/**
          retention-days: 30
