name: Release

# 发版前请同步：VERSION、DevEnv.csproj（Version 等）、CHANGELOG.md，再打标签 vX.Y.Z
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag（须与 VERSION 一致，如 v1.1.0）'
        required: true
        default: 'v1.1.0'

env:
  DOTNET_VERSION: '10.0.x'
  CSPROJ: DevEnv/DevEnv.csproj
  APP_ID: DevEnv
  PRODUCT_NAME: 燧岚开发盒子
  ARTIFACT_NAME: DevEnv
  COMPANY_NAME: FireNeb
  RUNTIME: win-x64

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: pwsh
        run: |
          function Fail([string]$Message) {
            Write-Error $Message
            exit 1
          }

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ github.event.inputs.version }}'.Trim()
          } else {
            $tag = '${{ github.ref_name }}'
          }

          if ($tag -notmatch '^v') { $tag = "v$tag" }
          $semver = $tag.Substring(1)

          if ($semver -notmatch '^\d+\.\d+\.\d+([-.][\w.-]+)?$') {
            Fail "Invalid version '$semver'. Use semver: X.Y.Z or X.Y.Z-prerelease"
          }

          if (-not (Test-Path VERSION)) {
            Fail 'Missing VERSION file at repository root.'
          }
          $versionFile = (Get-Content VERSION -Raw).Trim()
          if ($versionFile -ne $semver) {
            Fail @"
          Version mismatch:
            Git tag:     $tag ($semver)
            VERSION:     $versionFile

          Before releasing, set VERSION, DevEnv.csproj <Version>, and CHANGELOG ## [$semver], then commit and tag again.
          "@
          }

          $csproj = Get-Content DevEnv/DevEnv.csproj -Raw
          if ($csproj -notmatch '<Version>\s*([^\s<]+)\s*</Version>') {
            Fail 'Could not parse <Version> from DevEnv.csproj'
          }
          $csprojVersion = $Matches[1]
          if ($csprojVersion -ne $semver) {
            Fail @"
          Version mismatch:
            Git tag:           $semver
            DevEnv.csproj: $csprojVersion

          Update <Version> in DevEnv.csproj to match the tag.
          "@
          }

          if ($semver -match '^(\d+)\.(\d+)\.(\d+)') {
            $assemblyVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          } else {
            $assemblyVersion = "$semver.0"
          }

          $isPrerelease = $semver -match '[-.]'
          $prereleaseFlag = if ($isPrerelease) { 'true' } else { 'false' }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "is_prerelease=$prereleaseFlag" >> $env:GITHUB_OUTPUT

          Write-Host "Release version: $tag (assembly: $assemblyVersion, prerelease: $isPrerelease)"

      - name: Verify CHANGELOG entry
        shell: pwsh
        run: |
          $semver = '${{ steps.version.outputs.semver }}'
          $changelog = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($semver)
          if ($changelog -notmatch "## \[$escaped\]") {
            Write-Error "CHANGELOG.md has no '## [$semver]' section. Add release notes before tagging."
            exit 1
          }
          Write-Host "✓ CHANGELOG contains ## [$semver]"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Service-layer unit tests gate the release: a failing suite must never
      # produce an installer. Only the test project runs, never the WPF host.
      - name: Run tests
        run: dotnet test DevEnv.Tests/DevEnv.Tests.csproj -c Release --nologo

      # 便携发布：瘦身单文件 exe + Resources + 3 个组件 zip + latest.json/components.json。
      # package-release.ps1 内部会再跑一次完整发布到 staging，用于提取组件运行时资产。
      - name: Package portable release
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Configuration Release `
            -Runtime ${{ env.RUNTIME }} `
            -OutputDir ./artifacts/release `
            -Repository ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw "package-release.ps1 failed" }

      - name: Verify release artifacts
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.semver }}'
          $releaseDir = 'artifacts/release'
          $expected = @(
            "$releaseDir/DevEnv-$version-${{ env.RUNTIME }}.zip",
            "$releaseDir/DevEnv-$version-${{ env.RUNTIME }}.zip.sha256",
            "$releaseDir/latest.json",
            "$releaseDir/components.json",
            "$releaseDir/DevEnv-component-office-$version.zip",
            "$releaseDir/DevEnv-component-ocr-$version.zip",
            "$releaseDir/DevEnv-component-voice-$version.zip"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "发布产物缺失: $path" }
          }

          $exe = Join-Path $releaseDir 'app-publish\DevEnv.exe'
          if (-not (Test-Path $exe)) { throw "瘦身 exe 缺失: $exe" }
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($info.ProductVersion -notlike "$version*") {
            throw "Built exe ProductVersion is '$($info.ProductVersion)', expected '$version'"
          }
          $exeMb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          if ($exeMb -ge 70) { throw "瘦身 exe 仍然过大: $exeMb MB（目标 < 60 MB）" }
          Write-Host "✓ DevEnv.exe ProductVersion: $($info.ProductVersion), $exeMb MB"

          $manifest = Get-Content "$releaseDir/latest.json" -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version -or -not $manifest.url -or -not $manifest.sha256) {
            throw "latest.json 字段不完整"
          }
          $components = Get-Content "$releaseDir/components.json" -Raw | ConvertFrom-Json
          if ($components.components.Count -ne 3) {
            throw "components.json 应包含 3 个组件，实际 $($components.components.Count)"
          }

          Get-ChildItem -Path $releaseDir -File |
            Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize

      # 发布说明：git describe 在无上一 tag / 浅克隆时退出码非 0，
      # 必须用管道捕获 stdout 而非依赖 $LASTEXITCODE，最后显式 exit 0。
      - name: Build release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.semver }}'
          "## ${{ env.PRODUCT_NAME }} $version" | Set-Content RELEASE_NOTES.md
          $prev = ""
          git describe --tags --abbrev=0 "${{ github.sha }}~1" 2>$null | ForEach-Object { $prev = $_ }
          if ($prev) {
            git log --oneline "$prev..${{ github.sha }}" | Add-Content RELEASE_NOTES.md
          } else {
            "" | Add-Content RELEASE_NOTES.md
          }
          exit 0

      - name: Upload to GitHub Release (tag trigger)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = '${{ steps.version.outputs.semver }}'
          $releaseDir = 'artifacts/release'
          $assets = @(
            "$releaseDir/DevEnv-$version-${{ env.RUNTIME }}.zip",
            "$releaseDir/DevEnv-$version-${{ env.RUNTIME }}.zip.sha256",
            "$releaseDir/latest.json",
            "$releaseDir/components.json"
          )
          $assets += Get-ChildItem -Path $releaseDir -Filter "DevEnv-component-*.zip" |
            ForEach-Object { $_.FullName }

          $ghArgs = @('release', 'create', '${{ github.ref_name }}') + $assets + @(
            '--repo', '${{ github.repository }}',
            '--title', "${{ env.PRODUCT_NAME }} $version",
            '--notes-file', 'RELEASE_NOTES.md')
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      # workflow_dispatch 手动触发时保留最终产物供下载（不包含 full/app-publish 暂存目录）。
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ steps.version.outputs.semver }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
            artifacts/release/latest.json
            artifacts/release/components.json
          retention-days: 30
